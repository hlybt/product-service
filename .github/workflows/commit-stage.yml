name: Commit Stage  
on: workflow_dispatch

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
      packages: write 
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Setup Java JDK
        uses: actions/setup-java@v4.9.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build
  push:
    name: Push Docker Image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          chmod +x gradlew
          ./gradlew build
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/product-service"
          ./gradlew jib --image="${IMAGE_NAME}:${{ github.sha }}"
