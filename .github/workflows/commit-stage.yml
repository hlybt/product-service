name: Commit Stage  
on: workflow_dispatch

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Setup Java JDK
        uses: actions/setup-java@v4.9.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build
      

      

      

  
